name: Sync products from pricelist

on:
  push:
    branches: [main]
    paths:
      - "price list.xlsx"
      - "tracker/management/commands/import_price_list.py"
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # USE_DATABASE_URL opts in to the hosted database; without it local runs
      # deliberately stay on SQLite (see profit_tracker_pro/settings.py).
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_DATABASE_URL: 'True'
        run: python manage.py migrate

      - name: Sync products to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_DATABASE_URL: 'True'
        run: python manage.py import_price_list
