<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --sd-brand: #18181b;
    --sd-brand-ink: #09090b;
    --sd-brand-soft: #18181b;
    --sd-brand-line: #27272a;


    --sd-bg: #fafafa;
    --sd-card: #ffffff;
    --sd-border: #e4e4e7;
    --sd-muted-border: #f1f1f4;
    --sd-fg: #18181b;
    --sd-muted: #71717a;
    --sd-faint: #a1a1aa;
    --sd-primary: #18181b;
    --sd-primary-hover: #27272a;
    --sd-green: #16a34a;
    --sd-red: #dc2626;
    --sd-blue: #2563eb;
    --sd-radius: 16px;
    --sd-radius-sm: 10px;
    --sd-ring: 0 0 0 3px rgba(24, 24, 27, .12);
    --sd-shadow: 0 1px 2px rgba(9, 9, 11, .04), 0 8px 24px -12px rgba(9, 9, 11, .18);
    --sd-font: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                Roboto, "Helvetica Neue", Arial, sans-serif;
}

body {
    background-color: var(--sd-bg) !important;
    color: var(--sd-fg);
    -webkit-font-smoothing: antialiased;
}
    font-family: var(--sd-font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6,
.h1, .h2, .h3, .h4, .h5, .h6 {
    color: var(--sd-brand-ink) !important;
    letter-spacing: -0.02em;
    font-weight: 700;
}
p { color: #52525b; }
a { text-underline-offset: 3px; }
hr { border-color: var(--sd-border); opacity: 1; }

/* shadcn-style color system ------------------------------------------------ */
.bg-brand     { background: var(--sd-brand) !important; color: #fafafa !important; }
.bg-brand h1, .bg-brand h2, .bg-brand h3, .bg-brand h4, .bg-brand h5, .bg-brand h6,
.bg-brand .display-6, .bg-brand .fw-bold { color: #fafafa !important; }
.bg-brand-soft { background: var(--sd-brand-soft) !important; color: #fafafa !important; }
.bg-brand-soft h1, .bg-brand-soft h2, .bg-brand-soft h3, .bg-brand-soft h4, .bg-brand-soft h5, .bg-brand-soft h6,
.bg-brand-soft .display-6, .bg-brand-soft .fw-bold { color: #fafafa !important; }
.bg-brand-line { background: var(--sd-brand-line) !important; color: #fafafa !important; }

.text-brand      { color: var(--sd-brand) !important; }
.text-brand-soft { color: var(--sd-brand-soft) !important; }
.text-brand-line { color: var(--sd-brand-line) !important; }
.text-brand-ink  { color: var(--sd-brand-ink) !important; }


/* cards ------------------------------------------------------------ */
.card {
    background: var(--sd-card) !important;
    border: 1px solid var(--sd-border) !important;
    border-radius: var(--sd-radius) !important;
    box-shadow: var(--sd-shadow) !important;
}

/* card surface ------------------------------------------------------- */
.card,
.card-header,
.card-body,
.card-footer,
.card-title,
.card-subtitle {
    border-color: var(--sd-border) !important;
}

/* table surface ------------------------------------------------------- */
.table thead th {
    background: var(--sd-brand-soft) !important;
    color: var(--sd-fg) !important;
}
.card-header {
    background: #fafafa !important;
    border-bottom: 1px solid var(--sd-border) !important;
    border-radius: var(--sd-radius) var(--sd-radius) 0 0 !important;
    font-weight: 600;
    color: var(--sd-fg);
}
.list-group-item { border-color: var(--sd-muted-border) !important; background: transparent; }
.list-group-item:hover { background: #fafafa; }

/* navbars ----------------------------------------------------------- */
.navbar.bg-dark, .navbar-dark.bg-dark {
    background: #ffffff !important;
    border-bottom: 1px solid var(--sd-border);
    box-shadow: 0 1px 2px rgba(9, 9, 11, .04);
}
.navbar-dark .navbar-brand,
.navbar-dark .navbar-text,
.navbar-dark .nav-link {
    color: var(--sd-fg) !important;
    font-weight: 600;
}
.navbar-dark .navbar-brand:hover { color: var(--sd-muted) !important; }
.navbar-dark .navbar-brand.text-info { color: #0891b2 !important; }

/* buttons ----------------------------------------------------------- */
.btn {
    border-radius: var(--sd-radius-sm);
    font-weight: 550;
    font-size: .875rem;
    padding: .5rem 1rem;
    box-shadow: none;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.btn-lg { padding: .65rem 1.3rem; border-radius: 12px; font-size: .95rem; }
.btn-sm { padding: .3rem .7rem; font-size: .8rem; border-radius: 8px; }
.btn-primary {
    background: var(--sd-primary); border-color: var(--sd-primary); color: #fafafa;
}
.btn-primary:hover, .btn-primary:focus, .btn-primary:active {
    background: var(--sd-primary-hover); border-color: var(--sd-primary-hover); color: #fafafa;
}
.btn-outline-primary {
    background: #fff; border-color: var(--sd-border); color: var(--sd-fg);
}
.btn-outline-primary:hover, .btn-outline-primary:focus, .btn-outline-primary.active {
    background: #f4f4f5; border-color: var(--sd-border); color: var(--sd-fg);
}
.btn-success { background: var(--sd-green); border-color: var(--sd-green); color: #fff; }
.btn-success:hover, .btn-success:focus { background: #15803d; border-color: #15803d; color: #fff; }
.btn-outline-success { color: var(--sd-green); border-color: #bbf7d0; }
.btn-outline-success:hover { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
.btn-danger { background: var(--sd-red); border-color: var(--sd-red); }
.btn-info { background: #0891b2; border-color: #0891b2; color: #fff; }
.btn-info:hover { background: #0e7490; border-color: #0e7490; color: #fff; }
.btn-outline-secondary { border-color: var(--sd-border); color: var(--sd-muted); }.btn-outline-secondary:hover { background: #f4f4f5; border-color: var(--sd-border); color: var(--sd-fg); }

.btn-dark { background: var(--sd-brand); border-color: var(--sd-brand); color: #fafafa; }
.btn-dark:hover, .btn-dark:focus, .btn-dark:active {
    background: var(--sd-primary-hover); border-color: var(--sd-primary-hover); color: #fafafa;
}

.btn-outline-dark { background: transparent; border-color: var(--sd-brand); color: var(--sd-brand); }
.btn-outline-dark:hover, .btn-outline-dark:focus, .btn-outline-dark.active {
    background: var(--sd-brand-soft); border-color: var(--sd-brand); color: var(--sd-fg);
}

.btn-light { background: #fff; border-color: var(--sd-border); color: var(--sd-fg); }
.btn-check:focus-visible + .btn, .btn:focus-visible { box-shadow: var(--sd-ring); }

/* forms ------------------------------------------------------------- */
.form-control, .form-select {
    border-color: var(--sd-border) !important;
    border-radius: var(--sd-radius-sm) !important;
    background-color: #fff !important;
    padding: .5rem .75rem !important;
    font-size: .875rem;
    color: var(--sd-fg) !important;
    box-shadow: none !important;
}
.form-control:focus, .form-select:focus {
    border-color: var(--sd-primary) !important;
    box-shadow: var(--sd-ring) !important;
}

/* Price inputs: ensure selling/cost prices stand out on mobile */
.price-input, .qty-input {
    border: 1px solid var(--sd-border) !important;
    background: #fff !important;
    color: var(--sd-fg) !important;
}
.price-input:focus, .qty-input:focus {
    border-color: var(--sd-primary) !important;
    background: #fafafa !important;
}
.form-control::placeholder { color: var(--sd-faint); }
.form-label {
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--sd-faint);
    margin-bottom: .35rem;
}
.input-group-text {
    background: #fafafa;
    border-color: var(--sd-border);
    border-radius: var(--sd-radius-sm);
    color: var(--sd-muted);
    font-size: .875rem;
}
input[type="checkbox"], input[type="radio"] { accent-color: var(--sd-primary); }
.help-block, .form-text { color: var(--sd-faint); font-size: .78rem; }

/* tables ------------------------------------------------------------- */
.table {
    --bs-table-bg: transparent;
    --bs-table-color: var(--sd-fg);
    margin-bottom: 0;
    font-size: .875rem;
}
.table > :not(caption) > * > * { background-color: transparent; border-bottom-color: var(--sd-muted-border); }
.table thead th {
    background: var(--sd-brand-soft) !important;
    color: var(--sd-fg) !important;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--sd-border) !important;
    vertical-align: middle;
}
.table-hover > tbody > tr:hover > * { background-color: #fafafa !important; }
.table td, .table th { vertical-align: middle; }
.table-bordered { border-color: var(--sd-border); }
.table-bordered > :not(caption) > * > * { border-color: var(--sd-muted-border); }

/* badges / pills ----------------------------------------------------- */
.badge {
    border-radius: 999px;
    font-weight: 600;
    font-size: .7rem;
    letter-spacing: .02em;
    padding: .32em .7em;
}
.rounded-pill { border-radius: 999px !important; }

/* alerts ------------------------------------------------------------- */
.alert {
    border-radius: 14px;
    border-width: 1px;
    font-size: .875rem;
    box-shadow: var(--sd-shadow);
}
.alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
.alert-danger, .alert-warning { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
.alert-info { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

/* accents used across the app --------------------------------------- */
.stat-card {
    background: var(--sd-primary) !important;
    color: #fafafa !important;
    border: 1px solid var(--sd-primary) !important;
    border-radius: var(--sd-radius) !important;
}
.stat-card h1, .stat-card h2, .stat-card h3, .stat-card h5, .stat-card h6,
.stat-card .display-6, .stat-card .fw-bold { color: #fafafa !important; }
.bg-custom-blue { background: var(--sd-primary) !important; color: #fafafa; }
.bg-custom-blue h1, .bg-custom-blue h2, .bg-custom-blue h3,
.bg-custom-blue h4, .bg-custom-blue h5 { color: #fafafa !important; }

.text-success { color: var(--sd-green) !important; }
.text-danger { color: var(--sd-red) !important; }
.text-primary { color: #18181b !important; }

/* dropdowns, popups, modals ------------------------------------------ */
.dropdown-menu, .modal-content, .offcanvas {
    border: 1px solid var(--sd-border);
    border-radius: 12px;
    box-shadow: var(--sd-shadow);
    padding: .4rem;
}
.dropdown-item { border-radius: 8px; font-size: .875rem; padding: .4rem .7rem; }
.dropdown-item:hover { background: #f4f4f5; color: var(--sd-fg); }
.modal-content { border: 1px solid var(--sd-border); border-radius: 16px; box-shadow: var(--sd-shadow); }
.offcanvas { background: var(--sd-bg); }

/* ---------- mobile content ------------------------------------------------ */
/* Force the whole app content to the full mobile viewport so nothing is squeezed
   into a fake small desktop column on phones. */
@media (max-width: 640px) {
    html, body { min-width: 0 !important; }
    .container, .container-md, .container-sm, .container-lg, .container-xl, .container-xxl,
    .container-fluid { max-width: 100% !important; padding-left: 12px !important;
                       padding-right: 12px !important; }
    .container, .container-md, .container-sm, .container-lg, .container-xl, .container-xxl {
        padding-left: 12px !important; padding-right: 12px !important; }
    .col, .col-1, .col-2, .col-3, .col-4, .col-5, .col-6, .col-7, .col-8, .col-9, .col-10,
    .col-11, .col-12, .col-auto, .col-sm, .col-sm-auto, .col-sm-1, .col-sm-2, .col-sm-3,
    .col-sm-4, .col-sm-5, .col-sm-6, .col-sm-7, .col-sm-8, .col-sm-9, .col-sm-10,
    .col-sm-11, .col-sm-12, .col-sm-auto, .col-md, .col-md-auto, .col-md-1, .col-md-2,
    .col-md-3, .col-md-4, .col-md-5, .col-md-6, .col-md-7, .col-md-8, .col-md-9, .col-md-10,
    .col-md-11, .col-md-12, .col-md-auto, .col-lg, .col-lg-auto, .col-lg-1, .col-lg-2,
    .col-lg-3, .col-lg-4, .col-lg-5, .col-lg-6, .col-lg-7, .col-lg-8, .col-lg-9, .col-lg-10,
    .col-lg-11, .col-lg-12, .col-lg-auto, .col-xl, .col-xl-auto, .col-xl-1, .col-xl-2,
    .col-xl-3, .col-xl-4, .col-xl-5, .col-xl-6, .col-xl-7, .col-xl-8, .col-xl-9, .col-xl-10,
    .col-xl-11, .col-xl-12, .col-xl-auto, .col-xxl, .col-xxl-auto, .col-xxl-1, .col-xxl-2,
    .col-xxl-3, .col-xxl-4, .col-xxl-5, .col-xxl-6, .col-xxl-7, .col-xxl-8, .col-xxl-9,
    .col-xxl-10, .col-xxl-11, .col-xxl-12, .col-xxl-auto { max-width: 100% !important; padding-left: 4px !important;
    padding-right: 4px !important; }
}

/* Avoid overflowing content inside cards/table cells /wrapped rows. */
.text-truncate, .h-100, .h-75, .h-50, .h-25, .h-100vh, .vh-100 { max-width: 100% !important; }


/* misc ---------------------------------------------------------------- */
.sticky-top { z-index: 1020; }

/* ---------- content fit ------------------------------------------------------- */
/* Make long product / shop / category strings wrap instead of shrinking or
   overflowing, and keep cards and tables readable on narrow screens. */
.text-truncate { max-width: 100%; white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; }
.shorten { max-width: 100% !important; }

/* Tables: keep headers and cells readable, allow the table to scroll on very
   narrow screens instead of squashing every column. */
.table-responsive { width: 100% !important; margin-bottom: 0 !important; overflow-x: auto;
                     -webkit-overflow-scrolling: touch; }
.table th, .table td { white-space: normal !important; padding: .5rem .6rem !important;
                       word-break: break-word; overflow-wrap: anywhere; }
.table thead th { white-space: nowrap; }

/* Buttons inside tight spaces (chips, pill tables, form inputs): shrink to
   their content instead of stretching to the column width. */
.btn, .btn-sm, .btn-group { white-space: nowrap; }
.btn-sm { white-space: normal; }

</style>
