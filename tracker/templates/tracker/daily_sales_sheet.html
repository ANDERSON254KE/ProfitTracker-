{% extends "tracker/base.html" %}
{% load money %}

{% block title %}Sales sheet · {{ shop.name }} · Profit Tracker{% endblock %}

{% block content %}
<div class="mb-5">
    <div class="flex flex-wrap items-end justify-between gap-2">
        <div>
            <a href="{% url 'manager_dashboard' %}"
               class="text-xs font-medium text-zinc-500 hover:text-zinc-900">← Back to dashboard</a>
            <h1 class="mt-0.5 text-2xl font-bold tracking-tight text-zinc-900">Daily sales sheet</h1>
            <p class="mt-0.5 text-sm text-zinc-500">
                {{ shop.name }} · {{ today|date:"l, d F Y" }}
            </p>
        </div>
    </div>
</div>

{% include "tracker/_daily_sheet_form.html" %}
{% endblock %}
